<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Connect 3rd Party Apps · Lasso</title>
    <link rel="stylesheet" href="/connect.css?v=4" />
  </head>
  <body data-screen="intro">
    <main class="stage" id="stage">
      <canvas class="field" id="field" aria-hidden="true"></canvas>

      <section class="intro" id="intro" aria-labelledby="headline">
        <div class="intro-inner" id="intro-inner">
          <h1 class="headline" id="headline">
            <span class="visually-hidden">Lasso with Calendar, Outlook, Notion and Google Calendar</span>
            <span aria-hidden="true">Lasso with <span class="word" id="word"><span class="letters">Calendar</span></span></span>
          </h1>
          <div class="apps" id="apps" role="list" aria-label="Apps Lasso can connect to"></div>
          <p class="intro-note">Lasso only reads these apps, and keeps what it brings in on this Mac.</p>
        </div>
      </section>

      <section class="sheet" id="sheet" aria-label="Connect 3rd Party Apps" hidden>
        <header class="sheet-head">
          <button class="nav-back" id="back" type="button" aria-label="Back">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
          </button>
          <h2 id="sheet-title">Connect 3rd Party Apps</h2>
        </header>
        <div class="sheet-body" id="view" aria-live="polite"></div>
        <footer class="sheet-foot" id="foot"></footer>
      </section>
    </main>
    <script src="/connect-field.js?v=3"></script>
    <script src="/connect.js?v=4"></script>
  </body>
</html>
