<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Connect 3rd Party Apps · Lasso</title>
    <link rel="stylesheet" href="/connect.css?v=8" />

  <body data-screen="intro">
    <main class="stage" id="stage">
      <section class="intro" id="intro" aria-labelledby="headline">

          <h1 class="headline" id="headline">
            <span class="visually-hidden">Lasso with Google Drive, Outlook, Dropbox, Notion, iCloud Drive, Google Calendar, OneDrive and Calendar</span>
            <span aria-hidden="true">Lasso with <span class="word" id="word"><span class="letters">Google Drive</span></span></span>

          <div class="apps" id="apps" aria-label="Apps and cloud services Lasso can connect to"></div>

        </div>
      </section>

      <section class="sheet" id="sheet" aria-label="Connect 3rd Party Apps" hidden>
        <header class="sheet-head">
          <button class="nav-back" id="back" type="button" aria-label="Back">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
          </button>
          <h2 id="sheet-title">Connect 3rd Party Apps</h2>
        </header>
        <div class="sheet-body" id="view" aria-live="polite"></div>
        <footer class="sheet-foot" id="foot"></footer>
      </section>
    </main>
    <script src="/connect.js?v=8"></script>
