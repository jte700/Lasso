<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lasso card scenes</title>
<!-- The pictures and clips in the homepage and Loop cards are drawn here and captured by render.mjs.
     Open ?s=writer&theme=dark&live to watch a scene play. Each scene is a 1000 by 1000 drawing with
     a tick(t) that sets every element for a time in milliseconds, so a capture is the same each run. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #f4f5f1; --win: #ffffff; --bar: #f3f3f1; --ink: #1d1d1f; --ink-2: rgb(29 29 31 / .62); --ink-3: rgb(29 29 31 / .42);
  --line: rgb(0 0 0 / .085); --raise: #f4f4f2; --key: #ffffff; --link: #1a66d6; --wash: rgb(23 125 255 / .09); --under: rgb(23 125 255 / .9);
  --sel: rgb(10 132 255 / .14); --sel-edge: rgb(10 110 255 / .6); --menu: rgb(250 250 250 / .97);
  --shadow: 0 50px 90px -46px rgb(40 50 20 / .45), 0 0 0 1px rgb(0 0 0 / .08);
  --glow: .62; --hl: #ffe066; --good: #1f9d55; --bad: #d64545;
  --sky: #8ec5f4; --lime: #d4f75c; --rope: #d7bd85; --sage: #91a984; --terracotta: #c96749; --forest: #2f4322;
}
:root[data-theme="dark"] {
  --bg: #0d0e0f; --win: #1e1e1f; --bar: #2a2a2b; --ink: rgb(255 255 255 / .92); --ink-2: rgb(255 255 255 / .6); --ink-3: rgb(255 255 255 / .4);
  --line: rgb(255 255 255 / .09); --raise: #262628; --key: #2f2f31; --link: #5aa2ff; --wash: rgb(23 125 255 / .16); --under: rgb(90 162 255 / .95);
  --sel: rgb(10 132 255 / .26); --sel-edge: rgb(64 140 255 / .85); --menu: rgb(40 40 42 / .97);
  --shadow: 0 50px 100px -40px rgb(0 0 0 / .9), 0 0 0 1px rgb(255 255 255 / .1);
  --glow: .42; --good: #3ccf7a; --bad: #ff6b6b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
body { -webkit-font-smoothing: antialiased; }
#card { position: absolute; left: 0; top: 0; width: 1000px; height: 1000px; overflow: hidden; transform-origin: 0 0; background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; color: var(--ink); letter-spacing: -.005em; }
.glow { position: absolute; border-radius: 80px; filter: blur(64px); opacity: var(--glow);
  background: conic-gradient(from var(--a, 0deg), var(--sky), #b9a7ff, #ff9fbf, #ffc87a, var(--lime), #8fe3c8, var(--sky)); }
.stars { position: absolute; inset: 0; background-image:
  radial-gradient(1.6px 1.6px at 12% 18%, #fff8, transparent), radial-gradient(1.4px 1.4px at 78% 9%, #fff7, transparent), radial-gradient(1.2px 1.2px at 64% 30%, #fff5, transparent),
  radial-gradient(1.8px 1.8px at 88% 62%, #fff8, transparent), radial-gradient(1.2px 1.2px at 30% 84%, #fff6, transparent), radial-gradient(1.5px 1.5px at 8% 70%, #fff6, transparent),
  radial-gradient(1.2px 1.2px at 52% 92%, #fff5, transparent), radial-gradient(1.4px 1.4px at 94% 88%, #fff7, transparent), radial-gradient(1.1px 1.1px at 40% 6%, #fff6, transparent),
  radial-gradient(1.3px 1.3px at 22% 44%, #fff4, transparent), radial-gradient(1.2px 1.2px at 70% 76%, #fff5, transparent), radial-gradient(1.5px 1.5px at 96% 34%, #fff6, transparent); }
.win { position: absolute; border-radius: 24px; background: var(--win); box-shadow: var(--shadow); overflow: hidden; }
.bar { position: relative; height: 58px; display: flex; align-items: center; justify-content: center; background: var(--bar); box-shadow: inset 0 -1px 0 var(--line); font-size: 21px; font-weight: 600; color: var(--ink-2); }
.lights { position: absolute; left: 22px; top: 21px; display: flex; gap: 10px; }
.lights b { width: 16px; height: 16px; border-radius: 50%; background: #ff5f57; }
.lights b:nth-child(2) { background: #febc2e; } .lights b:nth-child(3) { background: #28c840; }
.bar small { position: absolute; right: 24px; font-size: 18px; font-weight: 500; color: var(--ink-3); }
.doc { padding: 40px 54px; font-size: 31px; line-height: 1.55; }
.doc p { margin: 0 0 18px; }
.mute { color: var(--ink-2); }
.caret { display: inline-block; width: 3px; height: 1.12em; margin-left: 2px; vertical-align: -.2em; background: #2f7cf6; }
.lk { border-radius: 6px; padding: 1px 2px; margin: 0 -1px; background: var(--wash); text-decoration: underline 2.5px var(--under); text-underline-offset: .2em; text-decoration-skip-ink: none; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.url { color: var(--link); }
.kc { display: inline-grid; place-items: center; min-width: 54px; height: 54px; padding: 0 14px; border-radius: 13px; background: var(--key); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line), 0 3px 0 var(--line), 0 14px 30px -14px rgb(0 0 0 / .4); font: 600 25px/1 -apple-system, sans-serif; }
.kc.sm { min-width: 34px; height: 30px; padding: 0 8px; border-radius: 8px; font-size: 17px; box-shadow: inset 0 0 0 1px var(--line); }
.kc.down { transform: translateY(3px) scale(.96); box-shadow: inset 0 0 0 1px var(--line), 0 0 0 var(--line); }
.ficon { --size: 34px; --ft: #1f8a4c; position: relative; flex: none; display: inline-block; width: var(--size); height: calc(var(--size) * 1.18); border-radius: calc(var(--size) * .14) calc(var(--size) * .3) calc(var(--size) * .14) calc(var(--size) * .14);
  background: linear-gradient(180deg, #fbfbfb, #e9e9ea); box-shadow: inset 0 0 0 1px rgb(0 0 0 / .1), 0 1px 2px rgb(0 0 0 / .2); }
.ficon i { position: absolute; left: -12%; bottom: 10%; min-width: 62%; padding: 0 3px; height: 46%; border-radius: 4px; display: grid; place-items: center; background: var(--ft); color: #fff; font: 700 calc(var(--size) * .3)/1 -apple-system, sans-serif; font-style: normal; }
.row { display: flex; align-items: center; gap: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 50px; padding: 0 24px; border-radius: 14px; font-size: 21px; font-weight: 600; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); }
.btn.blue { background: #2f7cf6; color: #fff; box-shadow: none; }
.fade { transition: none; }

/* the writer's pill by the caret */
.wpill { position: absolute; display: inline-flex; align-items: center; gap: 12px; height: 56px; padding: 0 12px 0 18px; border-radius: 999px; background: var(--menu); font-size: 22px; font-weight: 600; color: var(--ink);
  box-shadow: 0 0 0 1px var(--line), 0 18px 40px -18px rgb(0 0 0 / .5); transform-origin: 0 50%; }
.spark { width: 22px; height: 22px; background: conic-gradient(from 0deg, var(--sky), #b9a7ff, #ff9fbf, #ffc87a, var(--sky)); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
.think { background: linear-gradient(90deg, var(--ink-3) 0%, var(--ink-3) 35%, var(--ink) 50%, var(--ink-3) 65%, var(--ink-3) 100%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
.mail-f { display: flex; gap: 10px; padding: 16px 54px; font-size: 23px; color: var(--ink); box-shadow: inset 0 -1px 0 var(--line); }
.mail-f span { color: var(--ink-3); }

/* sheets */
.grid { border-collapse: collapse; font-size: 22px; font-variant-numeric: tabular-nums; }
.grid td { height: 52px; padding: 0 16px; border: 1px solid var(--line); white-space: nowrap; }
.grid td.h { background: var(--raise); color: var(--ink-3); text-align: center; font-size: 18px; font-weight: 600; padding: 0 10px; }
.grid td.n { text-align: right; }
.grid td.on { background: var(--sel); }
.hl-box { position: absolute; border: 3px solid var(--sel-edge); border-radius: 3px; pointer-events: none; }
.hl-box::after { content: ""; position: absolute; right: -7px; bottom: -7px; width: 11px; height: 11px; border-radius: 50%; background: var(--sel-edge); box-shadow: 0 0 0 2px var(--win); }

/* menus and sheets drawn over a window */
.menu { position: absolute; border-radius: 18px; background: var(--menu); box-shadow: 0 0 0 1px var(--line), 0 30px 60px -24px rgb(0 0 0 / .55); padding: 10px; font-size: 22px; }
.menu .mi { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 16px; border-radius: 10px; }
.menu .mi.on { background: #2f7cf6; color: #fff; }
.menu hr { border: 0; height: 1px; margin: 8px 6px; background: var(--line); }
.notice { margin: 4px 6px 6px; padding: 16px; border-radius: 12px; background: color-mix(in srgb, #ffb020 14%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, #ffb020 40%, transparent); font-size: 20px; }
.strike { text-decoration: line-through 2px; color: var(--ink-3); }
.new { color: var(--good); font-weight: 600; }

/* terminal */
.term { font: 400 20.5px/1.62 "Geist Mono", ui-monospace, Menlo, monospace; color: #e9e9e4; }
.term .dim { color: #8a8d86; } .term .lime { color: var(--lime); } .term .sky { color: var(--sky); } .term .you { color: #fff; }

/* The Loop: its own dark look and the website's typeface */
.loop { position: absolute; border-radius: 26px; overflow: hidden; background: #1a1b18; box-shadow: 0 60px 110px -40px rgb(0 0 0 / .85), 0 0 0 1px rgb(255 255 255 / .1);
  font-family: "Figtree", -apple-system, sans-serif; color: #f6f4ec; letter-spacing: -.01em; }
.loop .side { position: absolute; left: 0; top: 0; bottom: 0; width: 226px; padding: 70px 14px 0; font-size: 20px; color: rgb(246 244 236 / .7); }
.loop .side .lights { top: 24px; }
.loop .si { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px; border-radius: 12px; white-space: nowrap; font-size: 18.5px; }
.loop .si.on { background: rgb(246 244 236 / .1); color: #f6f4ec; }
.loop .si b { margin-left: auto; min-width: 26px; height: 24px; padding: 0 7px; border-radius: 999px; background: var(--terracotta); color: #fff; font-size: 15px; display: grid; place-items: center; }
.loop .si svg { width: 22px; height: 22px; flex: none; opacity: .85; }
.loop .sh { margin: 22px 14px 8px; font-size: 16px; font-weight: 600; color: rgb(246 244 236 / .4); }
.loop .tree { padding-left: 30px; }
.loop .page { position: absolute; left: 226px; top: 64px; right: 10px; bottom: 10px; border-radius: 18px; background: #0f100e; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .06); overflow: hidden; }
.loop .title { position: absolute; left: 252px; top: 14px; font-size: 25px; font-weight: 600; display: flex; align-items: center; gap: 14px; }
.loop .bell { position: absolute; right: 30px; top: 18px; width: 26px; height: 26px; opacity: .7; }
.loop .lrow { display: grid; grid-template-columns: 64px 30px 1fr 236px 14px; align-items: center; gap: 12px; height: 70px; padding: 0 26px; font-size: 20px; box-shadow: inset 0 -1px 0 rgb(255 255 255 / .06); }
.loop .lrow .t { color: rgb(246 244 236 / .45); font-variant-numeric: tabular-nums; }
.loop .who { display: flex; align-items: center; gap: 10px; }
.loop .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: #10110f; flex: none; }
.loop .src { display: flex; align-items: center; gap: 10px; color: rgb(246 244 236 / .7); overflow: hidden; white-space: nowrap; }
.loop .chev { width: 14px; height: 14px; border-right: 2.5px solid rgb(246 244 236 / .4); border-bottom: 2.5px solid rgb(246 244 236 / .4); transform: rotate(-45deg); }
.loop .newpill { position: absolute; left: 50%; top: 18px; translate: -50% 0; height: 44px; padding: 0 20px; border-radius: 999px; background: var(--sky); color: #0b1a28; font-size: 19px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 16px 30px -14px rgb(0 0 0 / .8); }
.loop .diff { overflow: hidden; background: rgb(246 244 236 / .035); box-shadow: inset 0 -1px 0 rgb(255 255 255 / .06); }
.loop .dl { display: grid; grid-template-columns: 30px 1fr 90px 90px; align-items: center; height: 46px; padding: 0 30px; font-size: 19px; font-variant-numeric: tabular-nums; }
.loop .dl.minus { background: rgb(255 107 107 / .12); } .loop .dl.plus { background: rgb(60 207 122 / .13); }
.loop .fact { display: flex; flex-wrap: wrap; gap: 6px 22px; padding: 18px 30px 14px; font-size: 17px; color: rgb(246 244 236 / .5); }
.loop .fact b { color: rgb(246 244 236 / .85); font-weight: 600; }
.loop .glass { background: rgb(40 41 37 / .82); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .1), inset 0 1px 0 rgb(255 255 255 / .12), 0 24px 50px -20px rgb(0 0 0 / .8); }
.loop .chip { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 999px; background: rgb(142 197 244 / .18); color: var(--sky); font-size: 18px; font-weight: 600; }
.loop .btn { font-family: inherit; background: rgb(246 244 236 / .1); color: #f6f4ec; box-shadow: none; border-radius: 999px; }
.loop .btn.ink { background: #f6f4ec; color: #10110f; }

/* the suggestion card, drawn for scenes without a captured picture */
.lc { position: absolute; display: grid; grid-template-columns: 44% 56%; border-radius: 22px; overflow: hidden; background: var(--menu); color: var(--ink);
  box-shadow: 0 0 0 1px var(--line), 0 40px 80px -30px rgb(0 0 0 / .6); font-size: 19px; transform-origin: 60px 0; }
.lc-l { padding: 16px 14px 0; box-shadow: inset -1px 0 0 var(--line); display: grid; grid-template-rows: auto 1fr auto; }
.lc-l h6 { margin: 2px 8px 12px; font-size: 17px; font-weight: 600; color: var(--ink-3); }
.lc-row { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: var(--sel); box-shadow: inset 0 0 0 1.5px var(--sel-edge); }
.lc-row b { display: block; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lc-row small { display: block; font-size: 15.5px; color: var(--ink-3); white-space: nowrap; }
.lc-foot { display: flex; gap: 10px; align-items: center; padding: 14px 6px; font-size: 15px; color: var(--ink-3); box-shadow: inset 0 1px 0 var(--line); margin: 0 -14px; padding-left: 20px; }
.lc-r { padding: 18px; display: grid; gap: 12px; align-content: start; }
.lc-r h5 { margin: 0; font-size: 20px; }
.lc-r small { color: var(--ink-3); font-size: 15.5px; }
.vframe { position: relative; height: 190px; border-radius: 12px; overflow: hidden; background: radial-gradient(70% 90% at 30% 30%, #3a3456, #131218); }
.vframe .cap { position: absolute; left: 12px; right: 12px; bottom: 34px; padding: 6px 10px; border-radius: 6px; background: rgb(0 0 0 / .55); color: #fff; font-size: 15px; text-align: center; }
.vframe .bar2 { position: absolute; left: 12px; right: 12px; bottom: 14px; height: 5px; border-radius: 3px; background: rgb(255 255 255 / .25); }
.vframe .bar2 i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: #fff; }
.vframe .tm { position: absolute; right: 12px; top: 10px; font-size: 14px; color: rgb(255 255 255 / .8); font-variant-numeric: tabular-nums; }
.vframe .who { position: absolute; left: 50%; top: 34px; translate: -50% 0; width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(#7c6bb0, #4a3f72); box-shadow: 0 60px 0 30px #3f3664; }

/* a desktop, for the USB scene */
.desk { position: absolute; border-radius: 24px; overflow: hidden; background: linear-gradient(160deg, #7fa7c9, #b9c9a4 60%, #d7bd85); box-shadow: var(--shadow); }
:root[data-theme="dark"] .desk { background: linear-gradient(160deg, #1d2a3a, #2a3324 60%, #3a3122); }
.menubar { height: 46px; display: flex; align-items: center; gap: 22px; padding: 0 20px; background: rgb(255 255 255 / .55); color: #1d1d1f; font-size: 18px; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
:root[data-theme="dark"] .menubar { background: rgb(20 20 22 / .6); color: #f2f2f2; }
.menubar .end { margin-left: auto; display: flex; align-items: center; gap: 18px; }
.mb-lasso { width: 34px; height: 30px; display: grid; place-items: center; border-radius: 8px; }
.mb-lasso img { width: 22px; height: 22px; }
.mb-lasso.lit { background: rgb(47 124 246 / .9); box-shadow: 0 0 0 4px rgb(47 124 246 / .25); }
.drive { position: absolute; display: grid; justify-items: center; gap: 8px; color: #fff; font-size: 17px; font-weight: 600; text-shadow: 0 1px 3px rgb(0 0 0 / .5); }
.drive i { width: 86px; height: 62px; border-radius: 12px; background: linear-gradient(#f4f4f4, #cfcfd2); box-shadow: inset 0 -10px 0 #b9b9bd, 0 8px 16px -6px rgb(0 0 0 / .5); position: relative; }
.drive i::after { content: ""; position: absolute; right: 12px; bottom: 16px; width: 8px; height: 8px; border-radius: 50%; background: #3ccf7a; }
.pop { position: absolute; width: 470px; border-radius: 20px; background: var(--menu); color: var(--ink); padding: 22px; font-size: 19px; box-shadow: 0 0 0 1px var(--line), 0 30px 60px -20px rgb(0 0 0 / .55); transform-origin: 90% 0; }
.pop b { font-size: 21px; }
.pop p { margin: 6px 0 0; color: var(--ink-2); font-size: 17.5px; }
.pop .acts { display: flex; gap: 10px; margin-top: 16px; }
.pop .acts .btn { height: 44px; font-size: 17.5px; padding: 0 18px; }
.chk { display: flex; align-items: center; gap: 12px; height: 44px; font-size: 18px; }
.chk i { width: 24px; height: 24px; border-radius: 7px; box-shadow: inset 0 0 0 2px var(--ink-3); display: grid; place-items: center; font-style: normal; font-size: 15px; color: #fff; }
.chk i.on { background: #2f7cf6; box-shadow: none; }
.chk span { margin-left: auto; color: var(--ink-3); font-size: 16px; font-variant-numeric: tabular-nums; }
.prog { height: 10px; border-radius: 5px; background: var(--line); margin-top: 16px; overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 5px; background: #2f7cf6; }
.dirs { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 18px; }
.dirs li { display: flex; gap: 10px; align-items: center; color: var(--ink-2); }
.dirs li.new { color: var(--ink); font-weight: 600; }
.dirs li::before { content: ""; width: 20px; height: 16px; border-radius: 4px; background: #7fb2ef; }

/* the ⌥Tab switcher */
.sw { position: absolute; border-radius: 26px; padding: 10px; background: color-mix(in srgb, var(--menu) 88%, transparent); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
  box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 rgb(255 255 255 / .2), 0 30px 60px -24px rgb(0 0 0 / .55); display: grid; gap: 8px; font-size: 19px; }
.sw-line { display: flex; align-items: center; gap: 6px; }
.sw-line > span { width: 118px; padding-left: 10px; font-size: 15.5px; font-weight: 600; color: var(--ink-3); }
.sw-seg { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 16px; border-radius: 999px; color: var(--ink-2); white-space: nowrap; }
.sw-seg.on { background: #2f7cf6; color: #fff; font-weight: 600; }
.sw-seg .ficon { --size: 20px; }

/* keys */
.keygrid { position: absolute; left: 90px; right: 90px; top: 150px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px 30px; font-family: "Figtree", -apple-system, sans-serif; }
.keycell { display: grid; gap: 12px; padding: 22px; border-radius: 24px; background: color-mix(in srgb, var(--win) 80%, transparent); box-shadow: inset 0 0 0 1px var(--line); }
.keycell .ks { display: flex; gap: 10px; }
.keycell .kc { min-width: 62px; height: 62px; font-size: 26px; border-radius: 14px; }
.keycell b { font-size: 22px; font-weight: 600; }
.keycell small { font-size: 18px; color: var(--ink-2); }
.keycell.star { grid-column: span 2; grid-template-columns: auto 1fr; align-items: center; column-gap: 26px; }
.keycell.star .kc { min-width: 150px; height: 92px; font-size: 38px; border-radius: 20px; background: #2f7cf6; color: #fff; box-shadow: 0 6px 0 #1f5fc8, 0 24px 40px -16px rgb(47 124 246 / .7); }
.keycell.star b { font-size: 30px; }

/* the passage picker */
.ppk { position: absolute; border-radius: 24px; overflow: hidden; background: var(--menu); box-shadow: 0 0 0 1px var(--line), 0 50px 100px -40px rgb(0 0 0 / .7); }
.ppk .page { margin: 22px 26px 0; padding: 34px 40px; border-radius: 10px 10px 0 0; background: #fff; color: #222; font-size: 20px; line-height: 1.65; box-shadow: 0 0 0 1px rgb(0 0 0 / .1); height: 520px; }
.ppk .page h4 { margin: 0 0 16px; font-size: 24px; }
.ppk .page p { margin: 0 0 14px; }
.ppk mark { background: rgb(255 224 102 / .95); color: inherit; border-radius: 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.ppk .foot { display: flex; align-items: center; gap: 12px; padding: 16px 22px; box-shadow: inset 0 1px 0 var(--line); font-size: 17px; color: var(--ink-3); }
.ppk .foot .btn { height: 44px; font-size: 18px; }
</style>
</head>
<body>
<div id="card"></div>
<script src="/assets/js/ascii-mascot.js"></script>
<script>
'use strict';
const params = new URLSearchParams(location.search);
document.documentElement.dataset.theme = params.get('theme') === 'dark' ? 'dark' : 'light';
const card = document.getElementById('card');
const fit = () => { card.style.transform = `scale(${innerWidth / 1000})`; };
addEventListener('resize', fit); fit();

/* ---------- time helpers ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const out3 = (x) => 1 - (1 - x) ** 3;

const esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const set = (el, styles) => Object.assign(el.style, styles);

  duration: 11000, still: 9000,
  build() {
    card.innerHTML = `<div class="glow" style="left:70px;top:110px;width:860px;height:900px;--a:210deg"></div>
    <div class="win" style="left:90px;top:140px;width:820px;height:940px">

    </div>`;
    this.prompt = '\\Write an email about the income tax expense';
    this.answer = words('Hi Priya,\n\nIncome tax expense was [5,200 in the current period], compared with [3,200 in the prior period], an increase of [2,000]. The statement does not give a reason for the increase.\n\nBest regards,\nSam');
  },
  tick(t) {
    const flow = $('#flow'), pill = $('#pill'), key = $('#pillKey'), label = $('#pillText');
    const TYPE_AT = 500, TYPE_MS = 48, PILL_AT = 2800, TAB_AT = 3700, ANSWER_AT = 5000, WORD_MS = 62, FADE_AT = 10300;
    if (t < TAB_AT + 150) {

  duration: 11000, still: 6400,
  build() {
    card.innerHTML = `<div class="glow" style="left:40px;top:80px;width:1000px;height:1000px;--a:120deg"></div>
    <div class="loop" style="left:50px;top:110px;width:900px;height:980px">

      <div class="page"><div id="list" style="position:absolute;left:0;right:0;top:0"></div><div class="newpill" id="newpill">↑ 1 new change</div></div>

  },
  tick(t) {
    const PILL_AT = 1300, CLICK_AT = 2500, OPEN_AT = 3900, CLOSE_AT = 9200, FADE_AT = 10300;
    const arrived = t > CLICK_AT;
    const slide = out3(seg(t, CLICK_AT, CLICK_AT + 500));
    const open = out3(seg(t, OPEN_AT, OPEN_AT + 550)) * (1 - out3(seg(t, CLOSE_AT, CLOSE_AT + 450)));
    const reset = seg(t, FADE_AT, FADE_AT + 600);
    const diffH = 330 * open;
    let html = '';
    if (arrived && reset < 1) {
      html += loopRow(this.fresh, `style="background:rgb(142 197 244 / ${0.16 * (1 - seg(t, OPEN_AT + 2200, OPEN_AT + 3200))});opacity:${slide * (1 - reset)}"`);
      html += `<div class="diff" style="height:${diffH}px">

    const list = $('#list');
    list.innerHTML = html;
    list.style.transform = arrived ? `translateY(${(1 - slide) * -70 + reset * -70}px)` : '';
    const pIn = spring(seg(t, PILL_AT, PILL_AT + 450)), pOut = seg(t, CLICK_AT, CLICK_AT + 200);

};

/* ---------- the card under the caret: placed so its pointer tip sits below the caret ---------- */
const unit = () => card.getBoundingClientRect().width / 1000;
const caretBox = (el) => { const r = el.getBoundingClientRect(), o = card.getBoundingClientRect(), k = unit(); return { x: (r.left - o.left) / k, y: (r.top - o.top) / k, bottom: (r.bottom - o.top) / k }; };
function placeUnder(caret, el, width, tipAt) {
  const c = caretBox(caret);
  const left = Math.max(24, Math.min(1000 - width - 24, c.x - tipAt));
  set(el, { left: `${left}px`, top: `${c.bottom + 4}px`, width: `${width}px` });
}
const docBar = (title, id = 'st', status = 'editing') => `<div class="bar">${LIGHTS}<span>${title}</span><small id="${id}">${status}</small></div>`;
const headLine = (t) => `<p class="mute" style="font-size:19px;font-weight:600;letter-spacing:.08em;text-transform:uppercase">${t}</p>`;
const keyOverlay = (keys, top = 860) => `<div id="keys" class="row" style="position:absolute;left:0;right:0;top:${top}px;justify-content:center;gap:12px">${keys.map((k) => `<span class="kc">${k}</span>`).join('')}</div>`;
function pressKeys(t, at, holdFrom, holdTo) {
  const box = $('#keys');
  const k = spring(seg(t, at, at + 380)), out = seg(t, holdTo, holdTo + 250);
  fade(box, clamp(k * 1.3) * (1 - out), 24 * (1 - k));
  [...box.children].forEach((el, i) => el.classList.toggle('down', t > holdFrom + i * 120 && t < holdTo));
}

    card.innerHTML = `<div class="glow" style="left:50px;top:100px;width:900px;height:900px;--a:280deg"></div>
    <div class="win" style="left:70px;top:130px;width:860px;height:960px">${docBar('Q3 close notes.docx')}
      <div class="doc">${headLine('Q3 close')}<p class="mute">Accruals were discussed on the close call.</p><p style="max-width:470px"><span id="typed"></span><span class="caret" id="caret"></span></p></div></div>
    <div class="lc" id="lc">
      <div class="lc-l"><h6>All sources</h6><div><div class="lc-row">${fileIcon('mov', 32)}<div style="min-width:0"><b>accruals are booked by the fifth</b><small>Q3 close call.mov · 12:41</small></div></div></div>
        <div class="lc-foot"><span class="kc sm" id="tabkey">⇥</span>Insert <span class="kc sm">↑</span><span class="kc sm">↓</span>Choose</div></div>
      <div class="lc-r"><div class="row" style="gap:12px">${fileIcon('mov', 34)}<div><h5>Q3 close call.mov</h5><small>Plays from 12:41</small></div></div>
        <div class="vframe"><span class="who"></span><span class="tm" id="tm">12:41</span><div class="cap">…so accruals are booked by the fifth, every month.</div><div class="bar2"><i id="prog"></i></div></div>
        <small>Matched words: <b style="color:var(--ink)">accruals are booked</b></small></div>
    </div>`;
    this.text = 'The controller said “accruals are booked';
    $('#typed').textContent = this.text;
    const c = caretBox($('#caret'));
    set($('#lc'), { left: '40px', top: `${c.bottom + 10}px`, width: '920px' });
  },
  tick(t) {
    const TYPE_AT = 400, TYPE_MS = 50, CARD_AT = 2700, TAB_AT = 7000, FADE_AT = 9600;
    const rest = ' by the fifth”';
    const typed = $('#typed');
    if (t < TAB_AT) typed.textContent = this.text.slice(0, Math.floor(clamp((t - TYPE_AT) / TYPE_MS, 0, this.text.length)));
    else typed.innerHTML = `The controller said <span class="lk">“accruals are booked${rest}</span>.`;
    typed.parentElement.style.opacity = 1 - seg(t, FADE_AT, FADE_AT + 500);
    const c = spring(seg(t, CARD_AT, CARD_AT + 420)), gone = seg(t, TAB_AT, TAB_AT + 160);
    set($('#lc'), { opacity: clamp(c * 1.4) * (1 - gone), transform: `scale(${0.94 + 0.06 * c})` });
    const played = clamp((t - CARD_AT - 300) / 1000, 0, 4);
    $('#prog').style.width = `${38 + played * 1.6}%`;
    $('#tm').textContent = `12:${String(41 + Math.floor(played)).padStart(2, '0')}`;
    $('#tabkey').classList.toggle('down', t > TAB_AT - 220 && t < TAB_AT);
    $('#st').textContent = t < CARD_AT ? 'editing' : t < TAB_AT ? 'previewing' : 'linked · 12:41';
  },
};

/* ---------- the passage picker: the highlight widened to the whole sentence, then Insert ---------- */
SCENES.passage = {
  duration: 10500, still: 5200,
  build() {
    card.innerHTML = `<div class="glow" style="left:40px;top:90px;width:920px;height:900px;--a:20deg"></div>
    <div class="win" style="left:70px;top:130px;width:860px;height:960px">${docBar('Advice note.docx')}
      <div class="doc">${headLine('Unit 4 lease renewal')}<p>Under clause 12.3, <span id="ins"></span><span class="caret"></span></p></div></div>
    <div class="ppk" id="ppk" style="left:60px;top:200px;width:880px;height:800px">
      <div class="bar" style="background:transparent">${LIGHTS}<span>lease_unit4_signed.pdf · Page 1</span></div>
      <div class="page"><h4>Lease Agreement · Unit 4</h4><p>12.2 The Tenant may renew this Lease for a further term of five (5) years.</p><p id="clause"></p><p>18.1 The Landlord’s aggregate liability under this Lease shall not exceed €250,000.</p></div>
      <div class="foot"><span>Select other words to change the highlight</span><span style="margin-left:auto" class="btn">Insert Link</span><span class="btn blue" id="insert">Insert</span></div>
    </div>`;
    this.words = '12.3 Notice to renew. The Tenant shall give the Landlord not less than six (6) months’ written notice of its intention to renew prior to expiry.'.split(' ');
  },
  tick(t) {
    const OPEN_AT = 300, GROW_AT = 1900, GROW_MS = 200, INSERT_AT = 6400, FADE_AT = 9600;
    const first = 4, firstEnd = 12; // the words typed: "The Tenant shall give the Landlord not less"
    const end = Math.min(this.words.length, firstEnd + Math.max(0, Math.floor((t - GROW_AT) / GROW_MS)));
    $('#clause').innerHTML = this.words.map((w, i) => (i === first ? '<mark>' : '') + esc(w) + (i === end - 1 ? '</mark>' : '')).join(' ');
    const o = spring(seg(t, OPEN_AT, OPEN_AT + 450)), gone = seg(t, INSERT_AT + 150, INSERT_AT + 450);
    set($('#ppk'), { opacity: clamp(o * 1.4) * (1 - gone), transform: `scale(${0.95 + 0.05 * o})` });
    $('#insert').style.transform = t > INSERT_AT - 160 && t < INSERT_AT + 80 ? 'scale(.95)' : '';
    $('#ins').innerHTML = t > INSERT_AT + 300 ? `<span class="lk">${esc(this.words.slice(first, end).join(' ').replace(/^The/, 'the'))}</span>` : '';
    $('#ins').parentElement.style.opacity = 1 - seg(t, FADE_AT, FADE_AT + 500);
    $('#st').textContent = t < INSERT_AT + 300 ? 'choosing words' : 'linked · page 1';
  },
};

/* ---------- running ---------- */
const name = params.get('s') || 'writer';
const scene = SCENES[name];
window.render = (t) => { if (scene.tick) scene.tick(t); return true; };
window.sceneInfo = { duration: scene.duration || 0, still: scene.still ?? 0 };
(async () => {
  await scene.build();
  await document.fonts.ready;
  await Promise.all([...card.querySelectorAll('img')].map((img) => img.decode().catch(() => {})));
  render(params.has('live') ? 0 : (scene.still ?? 0));
  window.ready = true;
  if (params.has('live') && scene.tick) {
    const start = performance.now();
    const loop = (now) => { render((now - start) % scene.duration); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
