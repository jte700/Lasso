name: Windows desktop
on:
  push:
    branches: [main]
    paths: ['desktop/windows/**', 'src/**', 'public/**', 'migrations/**', 'scripts/**', 'test/**', 'package*.json', '.github/workflows/windows.yml']
  pull_request:
    paths: ['desktop/windows/**', 'src/**', 'public/**', 'migrations/**', 'scripts/**', 'test/**', 'package*.json', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build, test, and package
        shell: pwsh
        run: ./desktop/windows/build.ps1 -Architecture x64
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Lasso-windows-x64
          path: |
            dist/windows/Lasso-win-x64.zip
            dist/windows/Lasso-win-x64.zip.sha256
          if-no-files-found: error
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics
          path: ~/AppData/Local/Lasso/logs/
          if-no-files-found: ignore
