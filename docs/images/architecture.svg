<svg xmlns="http://www.w3.org/2000/svg" width="760" height="404" viewBox="0 0 760 404" role="img" aria-labelledby="t d">
<title id="t">How Lasso works</title>
<desc id="d">The app you write in sends the text before the caret to the Lasso Mac app, which asks a local Node.js index server for suggestions and renders ghost text, the suggestion card, cell and passage pickers, source pills and The Loop. The server watches your folders, USB drives and connected apps locally in SQLite, exposes an MCP server for AI agents, and runs an optional AI writer only when you trigger a backslash prompt.</desc>
<style>
  .surface { fill: #fffdf7; stroke: #e3dfd2; }
  .box { fill: #f7f5ed; stroke: #d8d4c6; stroke-width: 1.2; }
  .box-accent { fill: #fffdf7; stroke: #2a6db0; stroke-width: 1.6; }
  .box-soft { fill: #f7f5ed; stroke: #5f7f51; stroke-width: 1.4; }
  .title { fill: #1b1f17; font: 600 17px 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -0.02em; }
  .head { fill: #1b1f17; font: 600 13.5px 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .line { fill: #5a5e55; font: 12px 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .edge { fill: #6c7067; font: 500 10.5px 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .arrow { stroke: #7b7f76; stroke-width: 1.4; fill: none; }
  .head-fill { fill: #7b7f76; }
  .boundary { fill: none; stroke: #2a6db0; stroke-width: 1.2; stroke-dasharray: 5 5; }
  .boundary-label { fill: #2a6db0; font: 600 11.5px 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #151513; stroke: #2c2c28; }
    .box { fill: #1d1d1a; stroke: #3a3a35; }
    .box-accent { fill: #1a1d21; stroke: #8ec5f4; }
    .box-soft { fill: #1b1e1a; stroke: #91a984; }
    .title, .head { fill: #f6f4ec; }
    .line { fill: #a9a79f; }
    .edge { fill: #8a8880; }
    .arrow { stroke: #8a8880; }
    .head-fill { fill: #8a8880; }
    .boundary { stroke: #8ec5f4; }
    .boundary-label { fill: #8ec5f4; }
  }
</style>
<defs>
  <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path class="head-fill" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>
<rect class="surface" x="0.5" y="0.5" width="759" height="403" rx="16"/>
<text x="24" y="34" class="title">How Lasso works</text>

<rect class="boundary" x="234" y="54" width="506" height="328" rx="14"/>
<text x="250" y="74" class="boundary-label">Local on your Mac · no model while typing · nothing uploaded unless shared</text>

<rect class="box" x="22" y="94" width="144" height="152" rx="12"/>
<text x="36" y="118" class="head">Any app you write in</text>
<text x="36" y="140" class="line">Word, Mail, Notes,</text>
<text x="36" y="157" class="line">Slack, Chrome, Docs</text>
<text x="36" y="174" class="line">&amp; macOS Dictation</text>
<text x="36" y="200" class="line">Inline ghost text</text>
<text x="36" y="217" class="line">&amp; linked source pills</text>

<rect class="box-accent" x="248" y="90" width="214" height="160" rx="12"/>
<text x="262" y="114" class="head">Lasso for Mac (Swift)</text>
<text x="262" y="136" class="line">Reads caret via Accessibility</text>
<text x="262" y="153" class="line">Suggestion card &amp; ghost text</text>
<text x="262" y="170" class="line">Cell &amp; passage pickers, dictation</text>
<text x="262" y="187" class="line">Scope switcher &amp; source pills</text>
<text x="262" y="204" class="line">The Loop &amp; Review Changes</text>
<text x="262" y="221" class="line">Share composer &amp; redaction</text>

<rect class="box-accent" x="504" y="90" width="222" height="160" rx="12"/>
<text x="518" y="114" class="head">Local index server (Node.js)</text>
<text x="518" y="136" class="line">Excel, CSV, PDF, Word, Slides</text>
<text x="518" y="153" class="line">STEP, IFC, DXF, LandXML, video</text>
<text x="518" y="170" class="line">Direct-match ranking &amp; history</text>
<text x="518" y="187" class="line">SQLite, zstd, search index</text>
<text x="518" y="204" class="line">Audit log &amp; PR-style reviews</text>
<text x="518" y="221" class="line">48-hour shares via mylasso.ca</text>

<rect class="box-soft" x="248" y="294" width="214" height="72" rx="12"/>
<text x="262" y="317" class="head">MCP server &amp; AI writer</text>
<text x="262" y="336" class="line">Claude, ChatGPT, Cursor over MCP</text>
<text x="262" y="353" class="line">Backslash prompts with citations</text>

<rect class="box" x="504" y="294" width="222" height="72" rx="12"/>
<text x="518" y="317" class="head">Your local sources</text>
<text x="518" y="336" class="line">Watched folders &amp; USB drives</text>
<text x="518" y="353" class="line">Outlook, Calendar &amp; Notion (opt-in)</text>

<path class="arrow" d="M166,150 H246" marker-end="url(#arrowhead)"/>
<path class="arrow" d="M246,186 H168" marker-end="url(#arrowhead)"/>
<text x="200" y="142" class="edge" text-anchor="middle">typing</text>
<text x="200" y="202" class="edge" text-anchor="middle">Tab / pills</text>

<path class="arrow" d="M462,150 H502" marker-end="url(#arrowhead)"/>
<path class="arrow" d="M502,186 H464" marker-end="url(#arrowhead)"/>
<text x="482" y="142" class="edge" text-anchor="middle">text</text>
<text x="482" y="202" class="edge" text-anchor="middle">ranked</text>

<path class="arrow" d="M615,292 V252" marker-end="url(#arrowhead)"/>
<text x="624" y="276" class="edge">changes</text>

<path class="arrow" d="M355,292 V252" marker-end="url(#arrowhead)" marker-start="url(#arrowhead)"/>
<text x="364" y="276" class="edge">prompt</text>

<path class="arrow" d="M462,312 L526,252" marker-end="url(#arrowhead)" marker-start="url(#arrowhead)"/>
<text x="498" y="286" class="edge">index</text>
</svg>
