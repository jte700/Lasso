<text x="260" y="113" class="label" text-anchor="end">Excel, 5,000 rows · 4 tasks</text><path class="series-1" d="M324,101 h316.73139508774585 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-316.73139508774585 z"/><text x="652.7313950877458" y="113" class="value" text-anchor="start">98% fewer</text>
<text x="260" y="145" class="label" text-anchor="end">PDF, 40 pages · 3 tasks</text><path class="series-1" d="M324,133 h270.6497503075921 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-270.6497503075921 z"/><text x="606.6497503075921" y="145" class="value" text-anchor="start">84% fewer</text>
<text x="260" y="177" class="label" text-anchor="end">STEP parts and assemblies · 7 tasks</text><path class="series-1" d="M324,165 h265.2618955466503 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-265.2618955466503 z"/><text x="601.2618955466503" y="177" class="value" text-anchor="start">83% fewer</text>
<text x="260" y="209" class="label" text-anchor="end">Excel, 6 to 12 rows · 7 tasks</text><path class="series-1" d="M324,197 h10.386095421775257 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-10.386095421775257 z"/><text x="346.3860954217753" y="209" class="value" text-anchor="start">4% fewer</text>
<text x="260" y="241" class="label" text-anchor="end">PDF, 8 to 9 pages · 19 tasks</text><path class="series-2" d="M324,229 h-14.877404411316501 a4,4 0 0 0 -4,4 v6 a4,4 0 0 0 4,4 h14.877404411316501 z"/><text x="332" y="241" class="value" text-anchor="start">6% more</text>
<text x="260" y="273" class="label" text-anchor="end">PDF, 1 to 2 pages · 2 tasks</text><path class="series-2" d="M324,261 h-40.51578773350963 a4,4 0 0 0 -4,4 v6 a4,4 0 0 0 4,4 h40.51578773350963 z"/><text x="332" y="273" class="value" text-anchor="start">14% more</text>
<text x="24" y="328" class="footnote" text-anchor="start">Tokens with Lasso against file tools on the same tasks, one live run. Small files cost less to read directly.</text>
