<text x="250" y="113" class="label" text-anchor="end">Excel, 5,000 rows · 4 tasks</text><path class="series-1" d="M314,101 h324.6021041696537 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-324.6021041696537 z"/><text x="650.6021041696538" y="113" class="value" text-anchor="start">98% fewer</text>
