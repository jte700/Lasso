<text x="250" y="209" class="label" text-anchor="end">Code &amp; file lookups · 32 tasks</text><path class="series-1" d="M314,197 h227.289463844379 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-227.289463844379 z"/><text x="553.289463844379" y="209" class="value" text-anchor="start">69% fewer</text>
<text x="250" y="241" class="label" text-anchor="end">PDF, 8 to 9 pages · 36 tasks</text><path class="series-1" d="M314,229 h82.06347822342784 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-82.06347822342784 z"/><text x="408.06347822342786" y="241" class="value" text-anchor="start">26% fewer</text>
<text x="250" y="273" class="label" text-anchor="end">Excel, 6 to 12 rows · 7 tasks</text><path class="series-1" d="M314,261 h10.73912843826054 a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-10.73912843826054 z"/><text x="336.73912843826054" y="273" class="value" text-anchor="start">4% fewer</text>
<text x="250" y="305" class="label" text-anchor="end">PDF, 1 to 2 pages · 2 tasks</text><path class="muted-bar" d="M314,293 h-41.60819970243012 a4,4 0 0 0 -4,4 v6 a4,4 0 0 0 4,4 h41.60819970243012 z"/><text x="322" y="305" class="value" text-anchor="start">14% more</text>
<text x="24" y="360" class="footnote" text-anchor="start">Tokens with Lasso against file tools on the same tasks (live runs in docs/agent). Small files cost less to read directly.</text>
