<svg xmlns="http://www.w3.org/2000/svg" width="760" height="148" viewBox="0 0 760 148" role="img" aria-labelledby="t d">
<title id="t">Measured results</title><desc id="d">69–77% fewer agent tokens (MCP); 45–52% lower model cost; 47/47 answers correct (42 without); 7.0 ms per keystroke, typing</desc>
<style>
  .surface { fill: #fcfcfb; stroke: #e6e5e1; }
  .title { fill: #0b0b0b; font: 600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .subtitle { fill: #52514e; font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .label { fill: #0b0b0b; font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .strong { fill: #0b0b0b; font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .value { fill: #0b0b0b; font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .tick { fill: #6f6e69; font: 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .grid { stroke: #e6e5e1; stroke-width: 1; }
  .axis { stroke: #a8a7a1; stroke-width: 1; }
  .reference { stroke: #52514e; stroke-width: 1.5; stroke-dasharray: 4 4; }
  .series-1 { fill: #2a78d6; }
  .series-2 { fill: #eb6834; }
  .muted-bar { fill: #c9c8c2; }
  .hero { fill: #0b0b0b; font: 700 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .hero-label { fill: #52514e; font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .accent { fill: #2a78d6; }
  .line-1 { fill: none; stroke: #2a78d6; stroke-width: 2.5; stroke-linejoin: round; }
  .line-base { fill: none; stroke: #8f8e88; stroke-width: 2; stroke-linejoin: round; }
  .dot-1 { fill: #2a78d6; stroke: #fcfcfb; stroke-width: 2; }
  .dot-base { fill: #8f8e88; stroke: #fcfcfb; stroke-width: 2; }
  .area-1 { fill: #2a78d6; fill-opacity: 0.08; }
  .callout { fill: #2a78d6; font: 700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .footnote { fill: #8f8e88; font: 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; stroke: #333330; }
    .title, .label, .strong, .value, .hero { fill: #f0efec; }
    .subtitle, .hero-label { fill: #c3c2b7; }
    .tick { fill: #9d9c95; }
    .grid { stroke: #333330; }
    .axis { stroke: #6f6e69; }
    .reference { stroke: #c3c2b7; }
    .series-1, .accent { fill: #3987e5; }
    .series-2 { fill: #d95926; }
    .muted-bar { fill: #5c5b56; }
    .line-1 { stroke: #3987e5; }
    .line-base { stroke: #7d7c76; }
    .dot-1 { fill: #3987e5; stroke: #1a1a19; }
    .dot-base { fill: #7d7c76; stroke: #1a1a19; }
    .area-1 { fill: #3987e5; }
    .callout { fill: #3987e5; }
    .footnote { fill: #7d7c76; }
  }</style>
<rect class="surface" x="0.5" y="0.5" width="759" height="147" rx="12"/>
<text x="24" y="34" class="title" text-anchor="start">Measured results</text>
<text x="24" y="54" class="subtitle" text-anchor="start">Agent figures: live model runs with provider-recorded token usage. Typing: local benchmark, Apple M3.</text>
<rect class="accent" x="24" y="78" width="3" height="44" rx="1.5"/><text x="38" y="106" class="hero" text-anchor="start">69–77%</text><text x="38" y="128" class="hero-label" text-anchor="start">fewer agent tokens (MCP)</text>
<rect class="accent" x="202" y="78" width="3" height="44" rx="1.5"/><text x="216" y="106" class="hero" text-anchor="start">45–52%</text><text x="216" y="128" class="hero-label" text-anchor="start">lower model cost</text>
<rect class="accent" x="380" y="78" width="3" height="44" rx="1.5"/><text x="394" y="106" class="hero" text-anchor="start">47/47</text><text x="394" y="128" class="hero-label" text-anchor="start">answers correct (42 without)</text>
<rect class="accent" x="558" y="78" width="3" height="44" rx="1.5"/><text x="572" y="106" class="hero" text-anchor="start">7.0 ms</text><text x="572" y="128" class="hero-label" text-anchor="start">per keystroke, typing</text>
</svg>
