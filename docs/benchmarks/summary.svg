<svg xmlns="http://www.w3.org/2000/svg" width="760" height="166" viewBox="0 0 760 166" role="img" aria-labelledby="t d">
<title id="t">Measured results</title><desc id="d">69–77% fewer agent tokens with Lasso MCP; 45–52% lower model cost on the same tasks; 47/47 answers correct vs 42/47 file tools; 7.0 ms median per keystroke while typing</desc>
<style>
  .surface { fill: #fcfcfb; stroke: #e6e5e1; }
  .title { fill: #0b0b0b; font: 600 17px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .subtitle { fill: #52514e; font: 13px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .label { fill: #0b0b0b; font: 13px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .strong { fill: #0b0b0b; font: 600 13px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .value { fill: #0b0b0b; font: 600 12px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .tick { fill: #6f6e69; font: 11px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .grid { stroke: #e6e5e1; stroke-width: 1; }
  .axis { stroke: #a8a7a1; stroke-width: 1; }
  .reference { stroke: #52514e; stroke-width: 1.5; stroke-dasharray: 4 4; }
  .series-1 { fill: #1f9d4c; }
  .series-1-light { fill: #6abd86; }
  .muted-bar { fill: #c9c8c2; }
  .hero { fill: #0b0b0b; font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -0.5px; }
  .hero-label { fill: #52514e; font: 12.5px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .accent { fill: #1f9d4c; }
  .line-1 { fill: none; stroke: #1f9d4c; stroke-width: 2.5; stroke-linejoin: round; }
  .line-base { fill: none; stroke: #8f8e88; stroke-width: 2; stroke-linejoin: round; }
  .dot-1 { fill: #1f9d4c; stroke: #fcfcfb; stroke-width: 2; }
  .dot-base { fill: #8f8e88; stroke: #fcfcfb; stroke-width: 2; }
  .area-1 { fill: #1f9d4c; fill-opacity: 0.08; }
  .callout { fill: #0b0b0b; font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .footnote { fill: #8f8e88; font: 11px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; stroke: #333330; }
    .title, .label, .strong, .value, .hero { fill: #f0efec; }
    .subtitle, .hero-label { fill: #c3c2b7; }
    .tick { fill: #9d9c95; }
    .grid { stroke: #333330; }
    .axis { stroke: #6f6e69; }
    .reference { stroke: #c3c2b7; }
    .series-1, .accent { fill: #28a752; }
    .series-1-light { fill: #1a6534; }
    .muted-bar { fill: #5c5b56; }
    .line-1 { stroke: #28a752; }
    .line-base { stroke: #7d7c76; }
    .dot-1 { fill: #28a752; stroke: #1a1a19; }
    .dot-base { fill: #7d7c76; stroke: #1a1a19; }
    .area-1 { fill: #28a752; }
    .callout { fill: #f0efec; }
    .footnote { fill: #7d7c76; }
  }</style>
<rect class="surface" x="0.5" y="0.5" width="759" height="165" rx="12"/>
<text x="24" y="34" class="title" text-anchor="start">Measured results</text>
<text x="24" y="54" class="subtitle" text-anchor="start">Agent figures: live model runs with provider-recorded token usage. Typing: local benchmark, Apple M3.</text>
<rect class="accent" x="24" y="80" width="3" height="62" rx="1.5"/><text x="38" y="108" class="hero" text-anchor="start">69–77%</text><text x="38" y="128" class="hero-label" text-anchor="start">fewer agent tokens</text><text x="38" y="144" class="hero-label" text-anchor="start">with Lasso MCP</text>
<rect class="accent" x="202" y="80" width="3" height="62" rx="1.5"/><text x="216" y="108" class="hero" text-anchor="start">45–52%</text><text x="216" y="128" class="hero-label" text-anchor="start">lower model cost</text><text x="216" y="144" class="hero-label" text-anchor="start">on the same tasks</text>
<rect class="accent" x="380" y="80" width="3" height="62" rx="1.5"/><text x="394" y="108" class="hero" text-anchor="start">47/47</text><text x="394" y="128" class="hero-label" text-anchor="start">answers correct</text><text x="394" y="144" class="hero-label" text-anchor="start">vs 42/47 file tools</text>
<rect class="accent" x="558" y="80" width="3" height="62" rx="1.5"/><text x="572" y="108" class="hero" text-anchor="start">7.0 ms</text><text x="572" y="128" class="hero-label" text-anchor="start">median per keystroke</text><text x="572" y="144" class="hero-label" text-anchor="start">while typing</text>
</svg>
